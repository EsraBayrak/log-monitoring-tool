<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log & Konfigürasyon İzleme (Spring Boot)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="fw-bold mb-0">Sunucu Log & Konfigürasyon İzleme</h3>
            <p class="text-muted mb-0 small">Spring Boot (Java 21) & SSH/SFTP Log Yönetim Paneli</p>
        </div>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addEnvModal">
            + Yeni Ortam Ekle
        </button>
    </div>

    <!-- Ortam Seçimi -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
            <h6 class="card-subtitle mb-2 text-muted fw-bold small">Ortam Seçin:</h6>
            <div class="d-flex gap-2 flex-wrap" id="envButtonsContainer">
                <!-- JS ile dinamik dolacak -->
            </div>
        </div>
    </div>

    <!-- Dosya Seçici Barı (Explorer Dropdown) -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2 bg-white">
            <div class="row g-2 align-items-center">
                <div class="col-md-7 d-flex gap-2 align-items-center">
                    <label class="fw-bold small text-nowrap mb-0">Dizindeki Dosyalar:</label>
                    <select id="fileDropdown" class="form-select form-select-sm" disabled>
                        <option value="">Önce yukarıdan bir ortam seçiniz...</option>
                    </select>
                </div>
                <div class="col-md-5 d-flex gap-2 justify-content-end">
                    <button id="btnReadSelectedFile" class="btn btn-sm btn-info text-white" onclick="fetchSelectedFile()" disabled>
                        Seçilen Dosyayı Oku
                    </button>
                    <button id="btnFetchLogs" class="btn btn-sm btn-success" onclick="fetchLogs()" disabled>
                        Aktif Log (tail -n 100)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Filtreleme ve Arama Barı -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <input type="text" id="searchInput" class="form-control form-control-sm" 
                           placeholder="Metin ara (Örn: NullPointerException, ERROR)..." onkeyup="filterLogs()">
                </div>
                <div class="col-md-7 d-flex gap-2">
                    <button class="btn btn-sm btn-outline-danger" onclick="filterByLevel('ERROR')">Sadece ERROR</button>
                    <button class="btn btn-sm btn-outline-warning" onclick="filterByLevel('WARN')">Sadece WARN</button>
                    <button class="btn btn-sm btn-outline-success" onclick="filterByLevel('INFO')">Sadece INFO</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="filterByLevel('')">Filtreyi Temizle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Terminal Görüntüleme Paneli -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2">
            <div class="d-flex align-items-center gap-2">
                <span id="selectedEnvBadge" class="badge bg-secondary">Ortam Seçilmedi</span>
                <span id="activeProcess" class="text-info small"></span>
            </div>
            <div>
                <button class="btn btn-sm btn-outline-light" onclick="clearConsole()">Temizle</button>
            </div>
        </div>
        <div class="card-body p-0 bg-black">
            <pre id="outputConsole" class="m-0 p-3" style="min-height: 450px; max-height: 600px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 0.88rem; white-space: pre-wrap; word-break: break-all; color: #d4d4d4;">Lütfen bir ortam seçiniz...</pre>
        </div>
    </div>
</div>

<!-- Yeni Ortam Modal -->
<div class="modal fade" id="addEnvModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Yeni Sunucu/Ortam Tanımla</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addEnvForm">
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Ortam Adı</label>
                        <input type="text" class="form-control form-control-sm" id="envName" placeholder="Örn: Test 3" required>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-8">
                            <label class="form-label small fw-bold">Host / IP</label>
                            <input type="text" class="form-control form-control-sm" id="envHost" placeholder="10.248.67.233" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label small fw-bold">Port</label>
                            <input type="number" class="form-control form-control-sm" id="envPort" value="22">
                        </div>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Kullanıcı Adı</label>
                            <input type="text" class="form-control form-control-sm" id="envUser" placeholder="testuser">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Şifre</label>
                            <input type="password" class="form-control form-control-sm" id="envPass">
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Dizin Yolu (Logs Directory)</label>
                        <input type="text" class="form-control form-control-sm" id="envDirPath" placeholder="/appdata/.../oim_m1/logs">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Varsayılan Log Dosyası</label>
                        <input type="text" class="form-control form-control-sm" id="envLogPath" placeholder="/appdata/.../oim_m1/logs/oim_m1.out">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">İptal</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="saveNewEnvironment()">Kaydet</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentEnvId = null;
    let rawLogContent = '';

    document.addEventListener('DOMContentLoaded', loadEnvironments);

    async function loadEnvironments() {
        try {
            const res = await fetch('/api/environments');
            const data = await res.json();
            const container = document.getElementById('envButtonsContainer');
            container.innerHTML = '';

            data.forEach(env => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-primary env-btn px-4 py-2';
                btn.innerText = env.name;
                btn.onclick = (e) => selectEnvironment(env.id, env.name, e.target);
                container.appendChild(btn);
            });
        } catch (err) {
            console.error('Ortamlar yüklenemedi:', err);
        }
    }

    async function selectEnvironment(id, name, targetBtn) {
        currentEnvId = id;
        document.getElementById('selectedEnvBadge').className = 'badge bg-primary';
        document.getElementById('selectedEnvBadge').innerText = 'Seçili: ' + name;
        
        document.getElementById('btnFetchLogs').disabled = false;

        document.querySelectorAll('.env-btn').forEach(b => {
            b.classList.remove('btn-primary');
            b.classList.add('btn-outline-primary');
        });
        targetBtn.classList.remove('btn-outline-primary');
        targetBtn.classList.add('btn-primary');

        // Ortam seçildiğinde dizindeki dosyaları dropdown'a otomatik yükle
        await populateFileList(id);
    }

    async function populateFileList(envId) {
        const dropdown = document.getElementById('fileDropdown');
        dropdown.disabled = true;
        dropdown.innerHTML = '<option value="">Dosyalar taranıyor...</option>';

        try {
            const res = await fetch(`/api/files?envId=${envId}`);
            const files = await res.json();

            dropdown.innerHTML = '<option value="">-- Dosya Seçiniz --</option>';
            files.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.innerText = f;
                dropdown.appendChild(opt);
            });

            dropdown.disabled = false;
            document.getElementById('btnReadSelectedFile').disabled = false;
        } catch (err) {
            dropdown.innerHTML = '<option value="">Dosyalar listelenemedi</option>';
        }
    }

    async function fetchSelectedFile() {
        const fileName = document.getElementById('fileDropdown').value;
        if (!currentEnvId || !fileName) {
            alert('Lütfen bir dosya seçiniz!');
            return;
        }

        setConsoleStatus('Dosya getiriliyor: ' + fileName, 'SFTP üzerinden indiriliyor...');

        try {
            const res = await fetch(`/api/file-content?envId=${currentEnvId}&fileName=${encodeURIComponent(fileName)}`);
            rawLogContent = await res.text();
            renderFormattedLogs(rawLogContent);
            document.getElementById('activeProcess').innerText = fileName + ' yüklendi (' + new Date().toLocaleTimeString() + ')';
        } catch (err) {
            document.getElementById('outputConsole').innerHTML = `<span class="text-danger">[Hata]: ${err}</span>`;
        }
    }

    async function fetchLogs() {
        if (!currentEnvId) return;
        setConsoleStatus('Aktif log okunuyor...', 'tail -n 100 komutu çalıştırılıyor...');

        try {
            const res = await fetch(`/api/logs?envId=${currentEnvId}&lines=100`);
            rawLogContent = await res.text();
            renderFormattedLogs(rawLogContent);
            document.getElementById('activeProcess').innerText = 'tail -n 100 güncellendi (' + new Date().toLocaleTimeString() + ')';
        } catch (err) {
            document.getElementById('outputConsole').innerHTML = `<span class="text-danger">[Hata]: ${err}</span>`;
        }
    }

    function renderFormattedLogs(text) {
        const consoleBox = document.getElementById('outputConsole');
        if (!text) { consoleBox.innerHTML = ''; return; }

        const lines = text.split('\n');
        const formatted = lines.map(line => {
            const up = line.toUpperCase();
            if (up.includes('ERROR') || up.includes('EXCEPTION') || up.includes('[HATA]')) {
                return `<span style="color: #ff6b6b;">${escapeHtml(line)}</span>`;
            } else if (up.includes('WARN')) {
                return `<span style="color: #feca57;">${escapeHtml(line)}</span>`;
            } else if (up.includes('INFO')) {
                return `<span style="color: #1dd1a1;">${escapeHtml(line)}</span>`;
            }
            return `<span style="color: #c8d6e5;">${escapeHtml(line)}</span>`;
        });
        consoleBox.innerHTML = formatted.join('\n');
    }

    function filterLogs() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        if (!rawLogContent) return;
        const filtered = rawLogContent.split('\n').filter(l => l.toLowerCase().includes(q)).join('\n');
        renderFormattedLogs(filtered);
    }

    function filterByLevel(lvl) {
        document.getElementById('searchInput').value = lvl;
        filterLogs();
    }

    function setConsoleStatus(status, text) {
        document.getElementById('activeProcess').innerText = status;
        document.getElementById('outputConsole').innerHTML = `<span class="text-secondary">${text}</span>`;
    }

    function clearConsole() {
        rawLogContent = '';
        document.getElementById('outputConsole').innerText = '';
        document.getElementById('activeProcess').innerText = '';
        document.getElementById('searchInput').value = '';
    }

    async function saveNewEnvironment() {
        const envData = {
            name: document.getElementById('envName').value,
            host: document.getElementById('envHost').value,
            port: parseInt(document.getElementById('envPort').value) || 22,
            username: document.getElementById('envUser').value,
            password: document.getElementById('envPass').value,
            logDirectoryPath: document.getElementById('envDirPath').value,
            logFilePath: document.getElementById('envLogPath').value
        };

        if (!envData.name || !envData.host) {
            alert('Lütfen Ortam Adı ve Host alanlarını doldurun!');
            return;
        }

        try {
            const res = await fetch('/api/environments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(envData)
            });

            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('addEnvModal')).hide();
                document.getElementById('addEnvForm').reset();
                loadEnvironments();
            }
        } catch (err) {
            alert('Hata: ' + err);
        }
    }

    function escapeHtml(t) {
        return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
